<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/toolbox.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 基础 SEO 标签 (精简版，其余由JS动态更新) -->
    <title>ToolHub - Developer Tools Collection</title>
    <meta name="description" content="Professional developer tools collection providing code formatting, encryption/decryption, data conversion and various online tools" />
    <meta name="keywords" content="developer tools, online tools, code formatter, encryption tools, data conversion" />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph (基础默认值，JS运行后会动态覆盖) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolHub" />
    <meta property="og:title" content="ToolHub - Developer Tools Collection" />
    <meta property="og:description" content="Professional developer tools collection providing code formatting, encryption/decryption, data conversion and various online tools" />
    <meta property="og:image" content="/toolbox.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ToolHub - Developer Tools Collection" />
    <meta name="twitter:description" content="Professional developer tools collection providing code formatting, encryption/decryption, data conversion and various online tools" />

    <!-- 结构化数据 (JSON-LD) - 精简版 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ToolHub",
      "url": "/",
      "applicationCategory": "DeveloperApplication",
      "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}
    }
    </script>
    
    <!-- 网站验证标签 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
