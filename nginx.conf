# 上游服务器配置（仅后端 API 使用，前端由 nginx 直接服务静态文件）
upstream backend {
    server localhost:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 限流配置
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# HTTP → HTTPS 重定向
# Cloudflare 使用 Full(Strict) 模式时，nginx 也需要处理 80 端口
server {
    listen 80;
    listen [::]:80;
    server_name toolhub.studio www.toolhub.studio;
    return 301 https://toolhub.studio$request_uri;
}

# www → 裸域名重定向（HTTPS）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.toolhub.studio;

    ssl_certificate /home/ubuntu/tool_hub/toolhub.studio.crt;
    ssl_certificate_key /home/ubuntu/tool_hub/toolhub.studio.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://toolhub.studio$request_uri;
}

# HTTPS 主配置（仅裸域名）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toolhub.studio;

    # SSL 证书配置
    ssl_certificate /home/ubuntu/tool_hub/toolhub.studio.crt;
    ssl_certificate_key /home/ubuntu/tool_hub/toolhub.studio.key;
    
    # SSL 安全配置（增强版）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # -------------------------------------------------------
    # 压缩配置
    # -------------------------------------------------------
    # 动态 Gzip（用于未预压缩的响应，如 API/代理内容）
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/markdown
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/xhtml+xml
        application/wasm
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # 全局静态预压缩：优先返回构建时生成的 .gz 文件
    # 需要 ngx_http_gzip_static_module（标准编译包含）
    gzip_static on;

    # 全局静态 Brotli 预压缩：优先返回构建时生成的 .br 文件
    # 需要安装 ngx_brotli 模块后才能启用，否则 nginx -t 会报错
    # 安装方式：apt install libnginx-mod-brotli（Ubuntu 20.04）或手动编译
    # brotli_static on;
    # brotli on;

    # -------------------------------------------------------
    # 缓冲区优化
    # -------------------------------------------------------
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # 客户端优化
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;
    
    # -------------------------------------------------------
    # 安全响应头
    # -------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
    
    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # 隐藏 nginx 版本
    server_tokens off;
    
    # 限流应用
    limit_req zone=general burst=50 nodelay;
    
    # -------------------------------------------------------
    # 健康检查
    # -------------------------------------------------------
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # -------------------------------------------------------
    # SEO 文件
    # -------------------------------------------------------
    location = /robots.txt {
        root /home/ubuntu/tool_hub/toolhub/dist;
        add_header Content-Type text/plain;
        expires 1d;
        add_header Cache-Control "public";
    }
    
    location = /sitemap.xml {
        root /home/ubuntu/tool_hub/toolhub/dist;
        add_header Content-Type application/xml;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Favicon
    location = /favicon.ico {
        root /home/ubuntu/tool_hub/toolhub/dist;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # -------------------------------------------------------
    # 静态资源：Vite 构建产物（带 hash，永久缓存）
    # assets/ 目录下所有 JS/CSS/字体/图片等均带 content hash
    # -------------------------------------------------------
    location ^~ /assets/ {
        root /home/ubuntu/tool_hub/toolhub/dist;

        # 优先返回预压缩文件（.br > .gz > 原文件）
        # gzip_static / brotli_static 全局已开启，此处无需重复声明

        # 永久强缓存（hash 文件名保证内容唯一）
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        
        # WASM 文件 MIME 类型由全局 mime.types 处理（现代 nginx 已内置 application/wasm）
        # 警告：不要在 location 块内写 types{}，否则会完全覆盖全局 mime.types
        # 导致 .js/.css 等文件变成 application/octet-stream

        access_log off;
    }
    
    # -------------------------------------------------------
    # 文档 Markdown 文件（TutorialAndDocs 动态 fetch）
    # 内容会更新，使用较短缓存 + 协商缓存
    # -------------------------------------------------------
    location ^~ /docs/ {
        root /home/ubuntu/tool_hub/toolhub/dist;
        try_files $uri =404;

        # 允许跨域（前端 fetch 调用）
        add_header Access-Control-Allow-Origin "*";
        # 缓存 1 小时，过期后协商缓存
        expires 1h;
        add_header Cache-Control "public, must-revalidate";

        # 正确设置 Markdown MIME 类型
        default_type text/markdown;

        access_log off;
    }
    
    # -------------------------------------------------------
    # 图片文件
    # -------------------------------------------------------
    location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
        root /home/ubuntu/tool_hub/toolhub/dist;
        try_files $uri =404;
        expires 6M;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept";
        access_log off;
    }
    
    # 字体文件
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        root /home/ubuntu/tool_hub/toolhub/dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }
    
    # SVG / ICO
    location ~* \.(ico|svg)$ {
        root /home/ubuntu/tool_hub/toolhub/dist;
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # -------------------------------------------------------
    # 后端 API
    # -------------------------------------------------------
    location /api/ {
        # API 限流
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        
        # API 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        add_header X-Request-ID $request_id always;
    }
    
    # -------------------------------------------------------
    # 安全：阻止访问敏感文件
    # -------------------------------------------------------
    location ~* \.(env|log|sql|conf|key|pem)$ {
        deny all;
        return 404;
    }
    
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # -------------------------------------------------------
    # 前端应用（Vue Router history 模式）
    # nginx 直接服务 dist 目录，不经过 vite preview 代理
    # 避免 vite preview 返回错误 MIME 类型
    # -------------------------------------------------------
    location / {
        root /home/ubuntu/tool_hub/toolhub/dist;

        # Vue Router history 模式：找不到文件时回退到 index.html
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（确保 index.html 始终获取最新版本，触发 chunk hash 更新）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}