# 上游服务器配置
upstream frontend {
    server localhost:4173 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream backend {
    server localhost:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 限流配置
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;  # IPv6 HTTP 重定向
    server_name toolhub.studio www.toolhub.studio;
    
    # 安全配置
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;  # IPv6 HTTPS
    server_name toolhub.studio www.toolhub.studio;
    
    # SSL 证书配置
    ssl_certificate /home/ubuntu/tool_hub/toolhub.studio.crt;
    ssl_certificate_key /home/ubuntu/tool_hub/toolhub.studio.key;
    
    # SSL 安全配置（增强版）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 性能优化
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/xhtml+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;
    
    # 缓冲区优化
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_write_size 256k;
    
    # 客户端优化
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;
    
    # 增强安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
    
    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # 隐藏 nginx 版本
    server_tokens off;
    
    # 限流应用
    limit_req zone=general burst=50 nodelay;
    
    # 健康检查端点
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # SEO 文件特殊处理
    location = /robots.txt {
        proxy_pass http://frontend/robots.txt;
        proxy_set_header Host $host;
        add_header Content-Type text/plain;
        expires 1d;
        add_header Cache-Control "public";
    }
    
    location = /sitemap.xml {
        proxy_pass http://frontend/sitemap.xml;
        proxy_set_header Host $host;
        add_header Content-Type application/xml;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Favicon 特殊处理
    location = /favicon.ico {
        proxy_pass http://frontend/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 静态文件缓存优化（分类处理）
    location ~* \.(js|css)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        gzip_static on;
    }
    
    location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 6M;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept";
    }
    
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    
    location ~* \.(ico|svg)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1M;
        add_header Cache-Control "public";
    }
    
    # 后端 API（增强版）
    location /api/ {
        # API 限流
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        
        # API 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # API 响应头
        add_header X-Request-ID $request_id always;
    }
    
    # 阻止访问敏感文件
    location ~* \.(env|log|sql|conf|key|pem)$ {
        deny all;
        return 404;
    }
    
    # 阻止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # 前端应用（Vue Router 支持）
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 前端超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 支持 Vue Router 的 history 模式
        try_files $uri $uri/ @fallback;
    }
    
    # Vue Router fallback
    location @fallback {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
} 